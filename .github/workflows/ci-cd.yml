name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  COVERAGE_THRESHOLD: 80

jobs:
  # Job 1: Lint and Format Check
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (Client)
        working-directory: ./client
        run: npm ci

      - name: Install dependencies (Server)
        working-directory: ./server
        run: npm ci

      - name: Run ESLint (Client)
        working-directory: ./client
        run: |
          if [ -f "package.json" ] && npm list eslint > /dev/null 2>&1; then
            npm run lint
          else
            echo "ESLint not configured for client, skipping..."
          fi
        continue-on-error: true

      - name: Run ESLint (Server)
        working-directory: ./server
        run: |
          if [ -f "package.json" ] && npm list eslint > /dev/null 2>&1; then
            npm run lint
          else
            echo "ESLint not configured for server, skipping..."
          fi
        continue-on-error: true

      - name: Run Prettier check (Client)
        working-directory: ./client
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}"
        continue-on-error: true

      - name: Run Prettier check (Server)
        working-directory: ./server
        run: npx prettier --check "src/**/*.{js,ts,json}"
        continue-on-error: true

  # Job 2: Unit Tests
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (Client)
        working-directory: ./client
        run: npm ci

      - name: Install dependencies (Server)
        working-directory: ./server
        run: npm ci

      - name: Run client unit tests
        working-directory: ./client
        run: npm test -- --run --coverage
        continue-on-error: true
        env:
          CI: true

      - name: Run server unit tests (with open handles fix)
        working-directory: ./server
        run: npm run test:unit
        continue-on-error: true
        env:
          CI: true
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci
          STRIPE_WEBHOOK_SECRET: test-webhook-secret

      - name: Upload client coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./client/coverage/coverage-final.json
          flags: client
          name: client-coverage
        continue-on-error: true

      - name: Upload server coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage/coverage-final.json
          flags: server
          name: server-coverage
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          echo "Coverage threshold check: ${{ env.COVERAGE_THRESHOLD }}%"
          echo "Note: Coverage enforcement can be enabled in future iterations"

  # Job 3: Critical Tests
  test-critical:
    name: Critical Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (Server)
        working-directory: ./server
        run: npm ci

      - name: Run critical tests (with open handles fix)
        working-directory: ./server
        run: npm run test:critical
        continue-on-error: true
        env:
          CI: true
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci
          STRIPE_WEBHOOK_SECRET: test-webhook-secret

      - name: Upload critical test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-test-results
          path: server/coverage/
          retention-days: 7

  # Job 4: Integration Tests
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_DATABASE: techverse_test
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand({ping: 1})' || mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (Server)
        working-directory: ./server
        run: npm ci

      - name: Install netcat for service checks
        run: sudo apt-get update && sudo apt-get install -y netcat

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB to be ready..."
          for i in {1..30}; do
            if nc -z localhost 27017; then
              echo "MongoDB is ready!"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done
        continue-on-error: true

      - name: Wait for Redis
        run: |
          echo "Waiting for Redis to be ready..."
          for i in {1..30}; do
            if nc -z localhost 6379; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done
        continue-on-error: true

      - name: Verify services are running
        run: |
          echo "Verifying MongoDB connection..."
          if nc -z localhost 27017; then
            echo "✅ MongoDB is accessible on port 27017"
          else
            echo "❌ MongoDB is not accessible on port 27017"
          fi
          
          echo "Verifying Redis connection..."
          if nc -z localhost 6379; then
            echo "✅ Redis is accessible on port 6379"
          else
            echo "❌ Redis is not accessible on port 6379"
          fi
        continue-on-error: true

      - name: Run integration tests
        working-directory: ./server
        run: |
          echo "Checking if integration tests are configured..."
          if npm run test:integration --dry-run 2>/dev/null; then
            echo "Running integration tests..."
            npm run test:integration
          else
            echo "Integration tests not configured yet, skipping..."
          fi
        continue-on-error: true
        env:
          CI: true
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/techverse_test
          MONGODB_TEST_URI: mongodb://localhost:27017/techverse_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci
          STRIPE_WEBHOOK_SECRET: test-webhook-secret

      - name: Generate test report
        if: always()
        run: echo "Integration tests completed"

  # Job 5: Build Client
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Build client for production
        working-directory: ./client
        run: npm run build
        continue-on-error: true
        env:
          NODE_ENV: production

      - name: Analyze bundle size
        working-directory: ./client
        run: |
          if [ -d "dist" ]; then
            echo "Build successful!"
            du -sh dist/
            find dist/ -name "*.js" -exec ls -lh {} \; | head -10
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build-${{ github.sha }}
          path: client/dist/
          retention-days: 30

  # Job 6: Build Server
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-critical]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./server
        run: npm ci --production

      - name: Create server bundle
        working-directory: ./server
        run: |
          echo "Server bundle created"
          tar -czf server-bundle.tar.gz src/ package.json package-lock.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-build-${{ github.sha }}
          path: server/server-bundle.tar.gz
          retention-days: 30

  # Job 7: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (Client)
        working-directory: ./client
        run: npm ci

      - name: Install dependencies (Server)
        working-directory: ./server
        run: npm ci

      - name: Run npm audit (Client)
        working-directory: ./client
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (Server)
        working-directory: ./server
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Security scan summary
        run: echo "Security scan completed"

  # Job 8: Deploy to Development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build-client, build-server, test-integration, test-critical, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: development
      url: https://dev.techverse.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-build-${{ github.sha }}
          path: ./client/dist

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: server-build-${{ github.sha }}
          path: ./server

      - name: Deploy to development server
        run: |
          echo "Deploying to development environment..."
          echo "Client URL: https://dev.techverse.com"
          echo "API URL: https://dev-api.techverse.com"
          echo "Commit SHA: ${{ github.sha }}"
          # Add actual deployment commands here

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here
        continue-on-error: true

      - name: Send deployment notification
        if: always()
        run: |
          echo "Deployment to development completed"
          echo "Status: ${{ job.status }}"
          # Add notification webhook here (Slack, Discord, etc.)

  # Job 9: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-client, build-server, test-integration, test-critical, security-scan]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.techverse.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-build-${{ github.sha }}
          path: ./client/dist

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: server-build-${{ github.sha }}
          path: ./server

      - name: Deploy to staging server
        run: |
          echo "Deploying to staging environment..."
          echo "Client URL: https://staging.techverse.com"
          echo "API URL: https://staging-api.techverse.com"
          echo "Commit SHA: ${{ github.sha }}"
          # Add actual deployment commands here

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here
        continue-on-error: true

      - name: Send deployment notification
        if: always()
        run: |
          echo "Deployment to staging completed"
          echo "Status: ${{ job.status }}"
          # Add notification webhook here

  # Job 10: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-client, build-server, test-integration, test-critical, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://techverse.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-build-${{ github.sha }}
          path: ./client/dist

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: server-build-${{ github.sha }}
          path: ./server

      - name: Deploy to production server
        run: |
          echo "Deploying to production environment..."
          echo "Client URL: https://techverse.com"
          echo "API URL: https://api.techverse.com"
          echo "Commit SHA: ${{ github.sha }}"
          # Add actual deployment commands here

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here
        continue-on-error: true

      - name: Send deployment notification
        if: always()
        run: |
          echo "Deployment to production completed"
          echo "Status: ${{ job.status }}"
          # Add notification webhook here (notify all stakeholders)
