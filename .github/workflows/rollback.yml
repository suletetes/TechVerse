name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: 'Version/commit to rollback to'
        required: true
        type: string
      reason:
        description: 'Reason for rollback'
        required: false
        type: string
        default: 'Manual rollback requested'

jobs:
  # Job 1: Validate Rollback Request
  validate-rollback:
    name: Validate Rollback Request
    runs-on: ubuntu-latest
    outputs:
      is-valid: ${{ steps.validate.outputs.is-valid }}
      target-commit: ${{ steps.validate.outputs.target-commit }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate rollback target
        id: validate
        run: |
          echo "Validating rollback request..."
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Target version: ${{ github.event.inputs.version }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          
          # Check if the target commit exists
          if git cat-file -e ${{ github.event.inputs.version }}^{commit}; then
            echo " Target commit exists"
            echo "is-valid=true" >> $GITHUB_OUTPUT
            echo "target-commit=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo " Target commit does not exist"
            echo "is-valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Show commit details
        run: |
          echo "Target commit details:"
          git log -1 --oneline ${{ github.event.inputs.version }}
          echo ""
          echo "Current commit:"
          git log -1 --oneline HEAD

  # Job 2: Pre-rollback Tests
  pre-rollback-tests:
    name: Pre-rollback Tests
    runs-on: ubuntu-latest
    needs: validate-rollback
    if: needs.validate-rollback.outputs.is-valid == 'true'
    
    steps:
      - name: Checkout target version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies (Server)
        working-directory: ./server
        run: npm ci

      - name: Run critical tests on target version
        working-directory: ./server
        run: npm run test:critical
        env:
          CI: true
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-rollback
          STRIPE_WEBHOOK_SECRET: test-webhook-secret

      - name: Verify open handles fix in target version
        working-directory: ./server
        run: npx jest tests/critical/cleanup.test.js --detectOpenHandles --forceExit
        env:
          CI: true
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-rollback

      - name: Test validation summary
        run: echo " Target version tests passed"

  # Job 3: Perform Rollback
  rollback:
    name: Perform Rollback
    runs-on: ubuntu-latest
    needs: [validate-rollback, pre-rollback-tests]
    environment: ${{ github.event.inputs.environment }}
    if: needs.validate-rollback.outputs.is-valid == 'true'
    
    steps:
      - name: Checkout target version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Create rollback timestamp
        id: timestamp
        run: echo "timestamp=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Backup current version
        run: |
          echo "Creating backup of current deployment..."
          echo "Backup timestamp: ${{ steps.timestamp.outputs.timestamp }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          # Add backup logic here
          # Example: Create backup artifacts, database snapshots, etc.

      - name: Download rollback artifacts
        run: |
          echo "Downloading artifacts for version ${{ github.event.inputs.version }}"
          echo "Note: In a real deployment, this would download the specific build artifacts"
          # Add logic to download specific version artifacts
          # This might involve downloading from artifact storage, container registry, etc.

      - name: Perform rollback deployment
        run: |
          echo " Performing rollback to ${{ github.event.inputs.version }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Backup created: backup_${{ steps.timestamp.outputs.timestamp }}"
          
          # Add actual rollback deployment commands here
          case "${{ github.event.inputs.environment }}" in
            "development")
              echo "Deploying to: https://dev.techverse.com"
              echo "API: https://dev-api.techverse.com"
              ;;
            "staging")
              echo "Deploying to: https://staging.techverse.com"
              echo "API: https://staging-api.techverse.com"
              ;;
            "production")
              echo "Deploying to: https://techverse.com"
              echo "API: https://api.techverse.com"
              ;;
          esac

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30

      - name: Verify rollback deployment
        run: |
          echo " Verifying rollback deployment..."
          # Add verification commands here
          # Example: Health checks, smoke tests, etc.
          echo " Rollback deployment verified"

  # Job 4: Post-rollback Verification
  post-rollback-verification:
    name: Post-rollback Verification
    runs-on: ubuntu-latest
    needs: rollback
    if: always() && needs.rollback.result == 'success'
    
    steps:
      - name: Run smoke tests
        run: |
          echo " Running post-rollback smoke tests..."
          echo "Environment: ${{ github.event.inputs.environment }}"
          
          # Add smoke test commands here
          case "${{ github.event.inputs.environment }}" in
            "development")
              echo "Testing: https://dev.techverse.com"
              ;;
            "staging")
              echo "Testing: https://staging.techverse.com"
              ;;
            "production")
              echo "Testing: https://techverse.com"
              ;;
          esac
          
          echo " Smoke tests passed"

      - name: Verify application health
        run: |
          echo " Checking application health..."
          # Add health check commands here
          echo " Application is healthy"

      - name: Check for memory leaks
        run: |
          echo " Checking for memory leaks..."
          # Add memory monitoring commands here
          echo " No memory leaks detected"

  # Job 5: Notification and Cleanup
  notify-and-cleanup:
    name: Notification and Cleanup
    runs-on: ubuntu-latest
    needs: [validate-rollback, pre-rollback-tests, rollback, post-rollback-verification]
    if: always()
    
    steps:
      - name: Determine rollback status
        id: status
        run: |
          if [ "${{ needs.rollback.result }}" == "success" ] && [ "${{ needs.post-rollback-verification.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message= Rollback completed successfully" >> $GITHUB_OUTPUT
          elif [ "${{ needs.validate-rollback.result }}" == "failure" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "message= Rollback validation failed" >> $GITHUB_OUTPUT
          elif [ "${{ needs.pre-rollback-tests.result }}" == "failure" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "message= Pre-rollback tests failed" >> $GITHUB_OUTPUT
          elif [ "${{ needs.rollback.result }}" == "failure" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "message= Rollback deployment failed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "message= Post-rollback verification failed" >> $GITHUB_OUTPUT
          fi

      - name: Create rollback report
        run: |
          echo "# Rollback Report" > rollback-report.md
          echo "" >> rollback-report.md
          echo "## Details" >> rollback-report.md
          echo "- **Environment**: ${{ github.event.inputs.environment }}" >> rollback-report.md
          echo "- **Target Version**: ${{ github.event.inputs.version }}" >> rollback-report.md
          echo "- **Reason**: ${{ github.event.inputs.reason }}" >> rollback-report.md
          echo "- **Status**: ${{ steps.status.outputs.status }}" >> rollback-report.md
          echo "- **Initiated By**: ${{ github.actor }}" >> rollback-report.md
          echo "- **Timestamp**: $(date)" >> rollback-report.md
          echo "" >> rollback-report.md
          echo "## Job Results" >> rollback-report.md
          echo "- Validation: ${{ needs.validate-rollback.result }}" >> rollback-report.md
          echo "- Pre-rollback Tests: ${{ needs.pre-rollback-tests.result }}" >> rollback-report.md
          echo "- Rollback Deployment: ${{ needs.rollback.result }}" >> rollback-report.md
          echo "- Post-rollback Verification: ${{ needs.post-rollback-verification.result }}" >> rollback-report.md
          echo "" >> rollback-report.md
          echo "${{ steps.status.outputs.message }}" >> rollback-report.md
          
          cat rollback-report.md

      - name: Upload rollback report
        uses: actions/upload-artifact@v4
        with:
          name: rollback-report-${{ github.event.inputs.environment }}-$(date +%Y%m%d_%H%M%S)
          path: rollback-report.md
          retention-days: 90

      - name: Send rollback notification
        run: |
          echo " Sending rollback notification..."
          echo "Status: ${{ steps.status.outputs.status }}"
          echo "Message: ${{ steps.status.outputs.message }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Version: ${{ github.event.inputs.version }}"
          echo "Initiated by: ${{ github.actor }}"
          
          # Add notification webhook here (Slack, Discord, email, etc.)
          # Example webhook payload:
          # {
          #   "text": "${{ steps.status.outputs.message }}",
          #   "environment": "${{ github.event.inputs.environment }}",
          #   "version": "${{ github.event.inputs.version }}",
          #   "reason": "${{ github.event.inputs.reason }}",
          #   "initiated_by": "${{ github.actor }}"
          # }
